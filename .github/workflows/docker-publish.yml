name: Build and publish Docker image

on:
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # The version shown in the GUI's footer: the pushed git tag on a
      # release ("v0.1.7"), or a short sha for an ordinary branch push to
      # main (which also builds/publishes an image, per the `on:` triggers
      # above, but isn't a tagged release).
      - name: Determine app version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # The build time shown in the GUI's footer. Computed here (not left to
      # the Dockerfile's own default) because the Dockerfile's
      # `ARG BUILD_TIMESTAMP=unknown` is only ever a fallback for a local,
      # no-build-arg `docker build` - this step is what actually supplies a
      # real value for every image this workflow publishes.
      - name: Determine build timestamp
        id: build_timestamp
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
            BUILD_TIMESTAMP=${{ steps.build_timestamp.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
