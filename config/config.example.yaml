# Copy this file to config.yaml (gitignored) and fill in real values.
# config.yaml must never be committed.

# One entry per bank connection. The KEY (here "sparebank1") is a name you
# choose - it is what each account mapping records as its provider, and its
# OAuth tokens are stored at state/tokens/<key>.json. Renaming a key orphans
# that provider's existing mappings until you re-point them in the GUI, so
# pick a name you're happy to keep.
#
# Several entries of the same `type` are allowed - the SpareBank1 alliance
# is many separate banks, so two sets of credentials is a realistic setup.
providers:
  sparebank1:
    type: sparebank1
    enabled: true
    client_id: ""
    client_secret: ""
    # Must match exactly the redirect URI registered for this client at developer.sparebank1.no
    redirect_uri: "http://localhost:8765/callback"
    # Optional: your bank's finInst identifier. Leave blank to get a bank picker during auth.
    fin_inst: ""

ynab:
  personal_access_token: ""
  # Human-readable aliases for the YNAB budgets you sync into.
  budgets:
    personal: ""
    shared: ""

sync:
  # Single cron expression - no need to fetch overnight. Default fires at
  # 06:00/08:00/10:00/12:00/16:00/20:00 daily, LOCAL wall-clock time in the
  # `timezone` below - not UTC.
  cron_expression: "0 6,8,10,12,16,20 * * *"
  # IANA zone name cron_expression's hours are evaluated in.
  timezone: "Europe/Oslo"
  # How far back every cycle re-fetches, as a safety margin against late-settling
  # transactions and clock drift. YNAB's import_id dedup makes re-fetching safe.
  lookback_overlap_hours: 72
  # Only used the first time an account has no last_synced_at cursor yet.
  initial_backfill_days: 30
  # How long a booked, tracked transaction is kept in local state before
  # it's eligible for pruning. Must stay past initial_backfill_days +
  # lookback_overlap_hours (enforced at config-load time).
  retention_days: 270
  # Max date difference (either direction) between two candidate legs still
  # considered the same account-to-account transfer.
  transfer_match_window_days: 4
  # Shared by transfer_match_window_days above and manual_match_window_days/
  # pending_import_date_window_days below. "working_days" excludes weekends
  # and Norwegian public holidays.
  match_window_unit: "calendar_days"
  # Opt-in (0 = disabled, the default): days of slack to look for a
  # pre-existing, manually-typed YNAB transaction with the exact same
  # amount as an incoming BOOKED bank transaction, before creating a new
  # one. Only affects BOOKED transactions - a PENDING transaction's own
  # manual-matching is controlled by pending_import_enabled below instead,
  # independent of this setting.
  manual_match_window_days: 0
  # Opt-in (false = disabled, the default): import PENDING SpareBank1
  # transactions on CREDITCARD accounts immediately (uncleared, at their
  # whole-kroner preauth amount), fuzzy-correlated with their later-booked
  # self. See CLAUDE.md's "PENDING-transaction import" section - scoped to
  # credit cards only, never bank transfers. Also makes a PENDING
  # transaction check against your own manually-typed YNAB entries before
  # creating a new one (using pending_import_amount_tolerance_kroner/
  # pending_import_date_window_days below), regardless of
  # manual_match_window_days above - a PENDING import colliding with
  # something you already typed in by hand is expected, not a separate
  # opt-in.
  pending_import_enabled: false
  pending_import_amount_tolerance_kroner: 2.0
  pending_import_date_window_days: 5
  # Optional, default 2. Decimal places this deployment's bank data uses (2
  # for NOK øre) - used only when parsing a provider's raw amount into an
  # exact internal Decimal. A future non-NOK provider can set this
  # per-deployment; true per-provider multi-currency is out of scope.
  currency_decimal_places: 2
  # A failed cycle is retried with exponential backoff: base * 2**attempt,
  # capped at retry_backoff_max_seconds.
  retry_backoff_base_seconds: 60
  retry_backoff_max_seconds: 1800

gui:
  enabled: true
  host: "0.0.0.0"
  port: 8080
  static_dir: "frontend/dist"

# Optional - omit this whole section, or set enabled: false, to run with
# no MQTT/Home Assistant integration at all.
mqtt:
  enabled: true
  host: "mqtt.local"
  port: 1883
  username: ""
  password: ""
  tls: false
  base_topic: "ynab_auto_sync"
  discovery_prefix: "homeassistant"

# Optional - omit this whole section, or its `ntfy:` subsection, to run
# with no discrete event-notification pushes at all. This is separate from
# mqtt/gui above: those two push continuous STATE (sync_state, run
# metadata) to a dashboard or Home Assistant; this pushes discrete EVENTS
# (one message per finished cycle) to something like a phone.
notifications:
  ntfy:
    enabled: true
    server: "https://ntfy.sh"
    # Pick a hard-to-guess topic name - anyone who knows it can read your
    # sync notifications (ntfy.sh topics are public by default) or subscribe
    # to a private one on a self-hosted server instead.
    topic: ""
    # Only needed for a private/protected topic on a self-hosted server.
    access_token: ""
    notify_on_success: false
    notify_on_success_with_changes: true
    notify_on_error: true

logging:
  level: "INFO"

# Optional debugging aid - off by default. When enabled, every raw
# provider/YNAB HTTP response is written to a gitignored file under
# state/api_logs/ for troubleshooting. Authorization headers and known
# secret fields (client_secret/refresh_token/access_token/password) are
# always redacted before anything is written. Files older than
# retention_days are deleted automatically as part of the regular sync
# cycle's cleanup pass.
api_response_logging:
  enabled: false
  retention_days: 7
