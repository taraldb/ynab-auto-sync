# Sample SWAG (linuxserver.io nginx reverse-proxy) config for exposing
# ynab-auto-sync's HTTP GUI/API at a subdomain, e.g. ynab.example.com.
#
# Copy this file into your SWAG container's nginx/proxy-confs/ directory
# (as ynab.subdomain.conf) and set up a DNS record / SWAG subdomain entry
# for "ynab" per SWAG's usual convention.
#
# SECURITY WARNING: this app has NO application-level authentication of
# its own by design (see CLAUDE.md - "Deliberate non-goals"). It can
# trigger real financial actions (importing transactions into YNAB,
# re-adding deleted ones). Do NOT expose it beyond your local network
# without adding access control in front of it - e.g. put it behind
# Cloudflare Access, or add HTTP basic auth at this nginx layer
# (see SWAG's authelia/basic-auth samples for the include snippet).
#
# Note on the resolver/upstream pattern below: we deliberately use nginx
# variables ($upstream_app/$upstream_port/$upstream_proto) to build the
# proxy_pass target instead of writing a literal
# "proxy_pass http://ynab-auto-sync:8080;" in the location block. With a
# literal proxy_pass, nginx resolves the hostname once at config-load
# time - if the ynab-auto-sync container isn't up yet when SWAG starts,
# nginx fails to start entirely. Using a variable forces nginx to consult
# the resolver (Docker's embedded DNS at 127.0.0.11) lazily, per-request,
# so SWAG comes up fine even if this service starts later or restarts.

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name ynab.*;

    include /config/nginx/ssl.conf;

    # Headroom for xlsx file-import uploads through the GUI.
    client_max_body_size 20M;

    location / {
        include /config/nginx/proxy.conf;
        resolver 127.0.0.11 valid=30s;
        set $upstream_app ynab-auto-sync;
        set $upstream_port 8080;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;

        # WebSocket upgrade support for /api/ws (the GUI's live push-update
        # channel - status changes, in-progress sync events - replacing/
        # supplementing the dashboard's 15s status poll).
        #
        # NOTE: SWAG's default /config/nginx/proxy.conf ALREADY includes
        # WebSocket headers (proxy_set_header Upgrade $http_upgrade and
        # proxy_set_header Connection $connection_upgrade), so DO NOT add
        # them here. Duplicating them causes nginx to send malformed headers
        # to the backend (the Upgrade/Connection header values get combined
        # with commas, e.g. "websocket, websocket"). If you're using a
        # different reverse proxy without WebSocket support in its default
        # proxy.conf, add them here instead.
        #
        # If using SWAG's proxy.conf (and WebSocket still doesn't work):
        # verify SWAG's nginx.conf (http{} scope) has this mapping:
        #   map $http_upgrade $connection_upgrade {
        #       default upgrade;
        #       '' close;
        #   }
        # SWAG commonly ships this (needed by Home Assistant/Nextcloud too),
        # but check your /config/nginx/nginx.conf if WebSocket connections fail.
    }
}
